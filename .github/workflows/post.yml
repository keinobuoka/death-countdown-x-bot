name: X auto post

on:
  schedule:
    - cron: '40 22 * * *'   # 07:40 JST — 通勤前に名言カード
    - cron: '30 13 * * *'   # 22:30 JST — 夜の問いかけ/Tips
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning / evening'
        default: 'morning'
      dry:
        description: 'true なら投稿せず本文表示のみ'
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install tweepy Pillow
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.dry }}" = "true" ]; then echo "dry=--dry" >> $GITHUB_OUTPUT; fi
          elif [ "$(date -u +%H)" = "22" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi
      - name: Post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 bot.py ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.dry }}
