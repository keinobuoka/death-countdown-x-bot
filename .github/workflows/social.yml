name: Instagram and Threads auto post

on:
  schedule:
    - cron: '0 22 * * *'    # 07:00 JST — 今日の名言
    - cron: '0 12 * * *'    # 21:00 JST — 問いかけ / Tips / 紹介
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning / evening'
        default: 'morning'
      dry:
        description: 'true なら投稿せず本文表示のみ'
        default: 'false'
      only:
        description: 'instagram / threads / 空欄で両方'
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install Pillow

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "22" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi

      - name: Generate card and publish to Pages
        run: |
          python3 make_card.py ${{ steps.mode.outputs.mode }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards
          git commit -m "card $(date -u -d '+9 hours' '+%Y-%m-%d') ${{ steps.mode.outputs.mode }}" || echo "no change"
          git pull --rebase -q origin main || true
          git push

      - name: Wait for Pages to serve the image
        run: sleep 90

      - name: Post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }}"
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          python3 social.py $ARGS

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "SNS投稿が失敗しました（$(date -u -d '+9 hours' '+%Y-%m-%d') ${{ steps.mode.outputs.mode }}）" \
            --body "自動投稿のジョブが失敗しました。ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

トークン失効（Instagram / Threads は約60日）が最も多い原因です。週次の Refresh tokens が動いているかを確認してください。"
